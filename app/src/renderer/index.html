<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>youtubesub-overlay</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    /* Animation tuning area (#222): the prototype's four variables; main
       pushes live values on every plan and the renderer overrides these. */
    :root { --fade-delay: 1.2s; --dur: 0.24s; --shrink: 0.72; --ease: cubic-bezier(.22,1,.36,1); }
    #box {
      margin: 4px; box-sizing: border-box;
      height: calc(100vh - 8px);
      /* background overridden per-plan (display.bg_color + bg_opacity) */
      background: rgba(0, 0, 0, 0.59);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.31);
      padding: 10px 14px;
      font-family: "Microsoft YaHei UI", sans-serif;
      color: #fff;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    /* Rows are plan-driven: one div per text event, divider element between
       the two rows of a bilingual plan. Qt point sizes arrive as integers and
       are mapped to px (* 4/3) by the renderer. */
    #rows { position: absolute; left: 14px; right: 14px; top: 14px; bottom: 26px;
      overflow: hidden;
      /* CSS takes over _draw_wrapped: spaces break, long unspaced runs break
         per character (overflow-wrap: anywhere), like the Python algorithm. */
      overflow-wrap: anywhere;
      text-wrap: pretty;
    }
    .row { margin: 0 0 4px; line-height: 1.2; }
    .divider { height: 1px; background: rgba(255, 255, 255, 0.3137); margin: 2px 0; }
    /* ---- Three-state transitions (#214 matrix, visual base = prototype 213).
       Every step is a CSS transition the compositor self-plays; plan pushes
       only flip body classes. Delay asymmetry rides the DESTINATION state's
       transition declaration: entering controls is immediate (0s), leaving
       waits --fade-delay (the delayed fade-out), so a re-enter during the
       wait simply retargets and fades in at once - no JS timers anywhere. */
    #ctl {
      position: absolute; left: 14px; right: 14px; bottom: 26px;
      opacity: 0; transform: translateY(10px); pointer-events: none;
      transition: opacity var(--dur) var(--ease) var(--fade-delay),
                  transform var(--dur) var(--ease) var(--fade-delay);
    }
    #ctl-title {
      font-size: 13px; color: rgba(242, 244, 248, 0.85);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    #ctl-bar { display: flex; align-items: center; gap: 10px; }
    #ctl-bar .zone { display: flex; gap: 6px; align-items: center; }
    #ctl-bar button {
      width: 36px; height: 34px; border: none; border-radius: 9px; cursor: pointer;
      background: rgba(255, 255, 255, 0.08); color: #fff;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
    }
    #ctl-bar button:hover { background: rgba(255, 255, 255, 0.16); }
    #ctl-bar button svg { width: 18px; height: 18px; fill: currentColor; }
    #seekwrap { flex: 1; height: 22px; display: flex; align-items: center; cursor: pointer; }
    #seektrack { width: 100%; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.18); position: relative; }
    #seekfill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: #4f8cff; }
    #seekghost { position: absolute; top: -3px; bottom: -3px; width: 2px; background: rgba(255, 255, 255, 0.7); display: none; }
    #timelabel { font-size: 11px; color: rgba(242, 244, 248, 0.6); font-variant-numeric: tabular-nums; }
    /* Subtitle shrink on enter: transform ONLY (#214: font-size must not
       join the transition). Leaving waits --fade-delay before scaling back;
       unlocking (passthrough -> subtitles) fades rows back in immediately. */
    #rows {
      transition: transform var(--dur) var(--ease) var(--fade-delay),
                  opacity var(--dur) var(--ease);
    }
    body.state-controls #ctl {
      opacity: 1; transform: translateY(0); pointer-events: auto;
      transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    body.state-controls #rows {
      transform: scale(var(--shrink));
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }
    body.state-passthrough #ctl {
      opacity: 0; transform: translateY(10px); pointer-events: none;
      transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    body.state-passthrough #rows {
      opacity: 0; transform: scale(1);
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }
    #status { position: absolute; left: 16px; bottom: 8px; right: 64px; color: #a0a0a0;
      font-size: 12px; font-family: Consolas, monospace; }
    /* Unlock icon: 40x40 hotspot larger than the visual so a pass-through
       hit from outside always lands inside (8px inner inset). Fades in with
       scale .6 -> 1 on click-through (#214); opacity+pointer-events (not
       display) so elementFromPoint hit-testing keeps working in .ct. */
    #unlock {
      position: absolute; right: 8px; bottom: 8px;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer; border-radius: 8px;
      opacity: 0; transform: scale(0.6); pointer-events: none;
      transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    body.ct #unlock { opacity: 1; transform: scale(1); pointer-events: auto; background: rgba(255, 255, 255, 0.12); }
    body.ct.hot-bg #unlock { background: rgba(255, 255, 255, 0.4); }
    /* Overlay context menu (#172 copy, shared model via main). */
    #ctxmenu {
      position: fixed; min-width: 200px; z-index: 1000;
      background: rgba(28, 28, 30, 0.97); border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px; padding: 4px 0; font-size: 13px; color: #eee;
    }
    #ctxmenu[hidden] { display: none; }
    .cm-item { padding: 5px 14px; cursor: default; white-space: nowrap; }
    .cm-item:hover { background: rgba(255, 255, 255, 0.15); }
    .cm-item[data-checked="1"]::before { content: "\2713\00a0"; }
    .cm-sep { height: 1px; background: rgba(255,255,255,0.2); margin: 4px 8px; }
  </style>
</head>
<body>
  <div id="box">
    <div id="rows"></div>
    <div id="ctl">
      <div id="ctl-title"></div>
      <div id="ctl-bar">
        <div class="zone">
          <button id="btn-back" title="后退 15 秒"><svg viewBox="0 0 24 24"><path d="M12 5V1L6 7l6 6V9c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg></button>
          <button id="btn-play" title="播放/暂停"><svg id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg id="i-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
          <button id="btn-fwd" title="前进 15 秒"><svg viewBox="0 0 24 24"><path d="M12 5V1l6 6-6 6V9c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6h2c0 4.4-3.6 8-8 8s-8-3.6-8-8 3.6-8 8-8z"/></svg></button>
        </div>
        <div id="seekwrap"><div id="seektrack"><div id="seekfill"></div><div id="seekghost"></div></div></div>
        <div id="timelabel"></div>
        <div class="zone">
          <button id="btn-mute" title="静音切换"><svg id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg><svg id="i-muted" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-3-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg></button>
        </div>
      </div>
    </div>
    <div id="status"></div>
    <div id="unlock" class="hot"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#ffd166"><path d="M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6-9h-1V6a5 5 0 0 0-9.9-1h2.1A3 3 0 0 1 15 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm0 12H6V10h12v10z"/></svg></div>
  </div>
  <div id="ctxmenu" hidden></div>
  <script src="renderer.js"></script>
</body>
</html>
