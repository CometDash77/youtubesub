<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>capcheck-overlay</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    #box {
      margin: 4px; box-sizing: border-box;
      height: calc(100vh - 8px);
      background: rgba(0, 0, 0, 0.59);   /* 对应现状 bg_opacity 150/255 */
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.31);
      padding: 10px 14px;
      font-family: "Microsoft YaHei UI", sans-serif;
      color: #fff;
      user-select: none;
      position: relative;
    }
    #trans { color: #ffe082; font-size: 19px; font-weight: bold; min-height: 24px; }
    #orig  { color: #ffffff; font-size: 15px; min-height: 20px; margin-top: 4px; }
    #status { position: absolute; left: 16px; bottom: 8px; right: 64px; color: #a0a0a0;
      font-size: 12px; font-family: Consolas, monospace; }
    /* 解锁图标：热区 40x40 大于视觉，保证穿透态外部命中（物理坐标内缩 8px 必中）。 */
    #unlock {
      position: absolute; right: 8px; bottom: 8px;
      width: 40px; height: 40px;
      display: none; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer; border-radius: 8px;
    }
    body.ct #unlock { display: flex; background: rgba(255, 255, 255, 0.12); }
    body.ct.hot-bg #unlock { background: rgba(255, 255, 255, 0.4); }
  </style>
</head>
<body>
  <div id="box">
    <div id="trans">【译】验证逐像素半透明</div>
    <div id="orig">【原】frameless + alwaysOnTop + translucent</div>
    <div id="status"></div>
    <div id="unlock" class="hot">🔓</div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
